<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LaisaOS Desktop</title>
<!-- Bump ?v= on style.css, config.js and desktop.js (bottom) after each change so browsers fetch the new files -->
<link rel="stylesheet" href="style.css?v=33">
</head>
<body>

<form id="login" hidden autocomplete="off"><div class="lg-in"><div class="lg-pic"><img alt=""></div><div class="lg-name"></div>
  <div class="lg-row"><input class="lg-pw" type="password" placeholder="Password" aria-label="Password" autocomplete="off"><button class="lg-go" aria-label="Log in">➜</button></div>
  <div class="lg-hint"></div><div class="lg-wait" hidden><i></i><span>Welcome</span></div></div><div class="lg-brand"></div></form>
<div id="boot" role="status" aria-live="polite"><div class="boot-in"><div class="boot-logo"></div><div class="boot-text">Starting…</div><div class="boot-bar"><i></i></div></div></div>

<img id="watermark" alt="" draggable="false">
<div id="desktop" role="list" aria-label="Desktop"></div>

<div id="start" hidden>
  <div class="sm-left" id="sm-left"></div>
  <div class="sm-right">
    <div class="sm-user" id="sm-user"></div>
    <div id="sm-links" style="display:flex;flex-direction:column;gap:2px"></div>
    <div class="sm-foot"><button class="shut" id="shut">Shut down</button></div>
  </div>
</div>

<div id="taskbar">
  <button id="orb" aria-label="Start"></button>
  <div id="tasks"></div>
  <button id="mpb" aria-label="Multiplayer"></button>
  <button id="vol" aria-label="Volume"></button>
  <button id="tray" aria-label="Clock and calendar"><span id="clock-t"></span><span id="clock-d"></span></button>
  <button id="peek" aria-label="Show desktop" title="Show desktop"></button>
</div>

<div id="cal" hidden>
  <div class="cal-in">
    <button class="cal-long" id="cal-long" title="Go to today"></button>
    <div class="cal-row">
      <div class="cal-left">
        <div class="cal-head"><button id="cal-prev" aria-label="Previous month">◀</button><span id="cal-month"></span><button id="cal-next" aria-label="Next month">▶</button></div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
      <div class="cal-clock"><svg id="cal-face" viewBox="0 0 100 100" aria-hidden="true"></svg><span id="cal-time"></span></div>
    </div>
    <div class="cal-info" id="cal-info"></div>
  </div>
</div>

<div id="volpop" hidden><div class="mx" role="group" aria-label="Volume mixer"></div></div>

<div id="off" hidden><div class="msg" id="off-msg"></div></div>

<script src="config.js?v=29"></script>
<script src="desktop.js?v=38"></script>
</body>
</html>
